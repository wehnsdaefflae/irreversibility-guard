[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irreversibility-guard"
version = "0.1.0"
description = "A guard that intercepts an agent's irreversible tool actions before they happen"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # standard library only: the tests need no network

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
